    <style id="theme-vars">
/* 极简计时器 — 暗色科技风格设计令牌 */

:root {
  /* 品牌主色：电光青 */
  --tm-primary: #38F2C6;
  --tm-primary-foreground: #04140F;

  /* 中性背景：近黑深空 */
  --tm-background: #070B0F;
  --tm-foreground: #E6EDF3;

  --tm-card: #0F151B;
  --tm-card-foreground: #E6EDF3;

  --tm-popover: #11181F;
  --tm-popover-foreground: #E6EDF3;

  --tm-muted: #1B232C;
  --tm-muted-foreground: #8B97A5;

  --tm-border: #1F2A35;
  --tm-input: #16202A;
  --tm-ring: #38F2C6;

  /* 语义状态色 */
  --tm-success: #34D399;
  --tm-warning: #FBBF24;
  --tm-danger: #F87171;

  /* 圆角刻度 */
  --tm-radius-sm: 8px;
  --tm-radius-md: 14px;
  --tm-radius-lg: 22px;

  /* 字体 */
  --tm-font-sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --tm-font-mono: "JetBrains Mono", "SFMono-Regular", "Cascadia Code", "Consolas", monospace;

  --tm-font-size-display: clamp(64px, 12vw, 168px);
  --tm-font-size-h1: 32px;
  --tm-font-size-h2: 22px;
  --tm-font-size-body: 15px;
  --tm-font-size-caption: 12px;

  --tm-font-weight-regular: 400;
  --tm-font-weight-medium: 500;
  --tm-font-weight-semibold: 600;
  --tm-font-weight-bold: 700;
}

    </style>

<body data-page="countdown" class="min-h-screen font-sans antialiased bg-background text-foreground">
    <!-- Background texture: grid + radial glow -->
    <div aria-hidden="true" class="bg-texture" data-bg-layer></div>

    <!-- Topbar (sticky, full-width, outside content container) -->
    <header class="topbar bg-background/70 backdrop-blur border-b border-border">
      <div class="topbar__inner max-w-2xl mx-auto px-5 h-14 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="grid place-items-center w-7 h-7 rounded-md bg-primary/10 border border-primary/20">
            <i data-lucide="timer" class="w-4 h-4 text-primary"></i>
          </span>
          <div class="flex flex-col leading-none">
            <span class="text-[14px] font-semibold text-foreground">极简计时器</span>
            <span class="text-[10px] tracking-[0.25em] text-muted-foreground">STOPWATCH · TIMER</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" aria-label="通知" class="grid place-items-center w-9 h-9 rounded-full bg-card border border-border text-muted-foreground hover:text-foreground transition-colors">
            <i data-lucide="bell" class="w-4 h-4"></i>
          </button>
          <button data-dom-id="icon-settings" type="button" aria-label="设置" class="grid place-items-center w-9 h-9 rounded-full bg-card border border-border text-muted-foreground hover:text-foreground transition-colors">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="content-wrap max-w-2xl mx-auto px-5 py-10 flex flex-col gap-8">

      <!-- Tabs (倒计时 active) -->
      <nav class="tabs" aria-label="计时模式">
        <div class="tabs__pill inline-flex items-center gap-1 bg-muted/60 rounded-full p-1">
          <button data-dom-id="tab-stopwatch" class="tab inline-flex items-center gap-1.5 px-5 py-1.5 rounded-full text-[13px] text-muted-foreground">
            <i data-lucide="timer" class="w-3.5 h-3.5"></i>
            <span>秒表</span>
          </button>
          <button data-dom-id="tab-countdown" class="tab tab--active inline-flex items-center gap-1.5 px-5 py-1.5 rounded-full text-[13px] font-medium text-foreground bg-card border border-border">
            <i data-lucide="hourglass" class="w-3.5 h-3.5"></i>
            <span>倒计时</span>
          </button>
        </div>
        <span class="tabs__indicator" aria-hidden="true"></span>
      </nav>

      <!-- Display (countdown: remaining) -->
      <section class="display-block flex flex-col items-center gap-3" aria-label="倒计时显示">
        <span class="text-[11px] tracking-[0.3em] text-muted-foreground">剩余 · REMAINING</span>
        <div class="display__digits font-mono tabular-nums leading-none tracking-tight text-foreground" aria-live="polite">
          <span class="display__main">00:15</span><span class="display__ms">.000</span>
          </div>
        <span id="target-label" class="text-[11px] text-muted-foreground">目标 15 秒 · 秒级训练</span>
      </section>

      <!-- Progress (countdown: full bar = just set) -->
      <section class="progress" aria-label="倒计时进度">
        <div class="progress__track relative h-px w-full bg-border">
          <div class="progress__fill absolute left-0 top-0 h-px bg-primary" style="width:100%"></div>
          <div class="progress__ticks absolute inset-0 flex justify-between">
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
            <span class="w-px h-2 -translate-y-[3px] bg-border"></span>
          </div>
        </div>
      </section>

      <!-- Presets (replaces laps) -->
      <section class="presets-card bg-card/70 rounded-lg border border-border" aria-label="时长预设">
        <div class="flex items-center justify-between px-4 pt-3.5 pb-2">
          <span class="text-[11px] tracking-[0.25em] text-muted-foreground">时长预设 · PRESETS</span>
          <span class="text-[11px] text-muted-foreground font-mono">单位：秒</span>
        </div>
        <!-- 秒级档（唯一预设） -->
        <div class="px-4 pb-2">
          <span class="block text-[10px] tracking-[0.25em] text-muted-foreground/70 mb-2">SECONDS · 秒级</span>
        </div>
        <div class="flex flex-wrap items-stretch justify-center gap-2 px-4 pb-4">
          <button data-dom-id="preset-15s" data-unit="sec" type="button" class="preset rounded-md border border-border bg-transparent px-5 py-2.5 flex flex-col items-center gap-0.5 hover:bg-muted/50 transition-colors">
            <span class="font-mono text-[18px] text-foreground">15<span class="text-[12px] text-muted-foreground">s</span></span>
            <span class="text-[10px] text-muted-foreground">反应</span>
          </button>
          <button data-dom-id="preset-30s" data-unit="sec" type="button" class="preset rounded-md border border-border bg-transparent px-5 py-2.5 flex flex-col items-center gap-0.5 hover:bg-muted/50 transition-colors">
            <span class="font-mono text-[18px] text-foreground">30<span class="text-[12px] text-muted-foreground">s</span></span>
            <span class="text-[10px] text-muted-foreground">爆发</span>
          </button>
          <!-- 自定义秒数 -->
          <div data-dom-id="preset-custom" data-unit="sec" class="preset rounded-md border border-border bg-transparent px-5 py-2.5 flex flex-col items-center gap-0.5 hover:bg-muted/50 transition-colors cursor-text">
            <input data-dom-id="custom-seconds" type="text" inputmode="numeric" value="60" placeholder="自定义" class="w-12 bg-transparent text-center font-mono text-[18px] text-foreground placeholder:text-muted-foreground/60 focus:outline-none" aria-label="自定义秒数" />
            <span class="text-[10px] text-muted-foreground">自定义</span>
          </div>
        </div>
        <!-- Custom duration input (minute only; disabled when second preset active) -->
      </section>

      <!-- Controls (countdown) -->
      <section class="controls flex flex-wrap items-center justify-center gap-3" aria-label="倒计时控制">
        <button data-dom-id="btn-start" type="button" class="btn btn--primary inline-flex items-center gap-2 rounded-full px-8 py-3 font-medium bg-primary text-primary-foreground hover:opacity-90 transition-opacity">
          <i data-lucide="play" class="w-4 h-4"></i>
          <span>开始</span>
        </button>
        <button data-dom-id="btn-reset" type="button" class="btn inline-flex items-center gap-2 rounded-full px-6 py-3 bg-transparent border border-border text-muted-foreground hover:text-foreground transition-colors">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          <span>重置</span>
        </button>
        <button data-dom-id="btn-sound" type="button" class="btn inline-flex items-center gap-2 rounded-full px-6 py-3 bg-transparent border border-border text-foreground hover:bg-card/60 transition-colors">
          <i data-lucide="bell" class="w-4 h-4"></i>
          <span>铃声</span>
        </button>
      </section>

      <!-- Usecase -->
      <section class="usecase flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-muted-foreground text-[13px]" aria-label="适用场景">
        <span class="inline-flex items-center gap-1.5">
          <i data-lucide="zap" class="w-3.5 h-3.5"></i>视频延迟对比
        </span>
        <span class="text-muted-foreground/60" aria-hidden="true">·</span>
        <span class="inline-flex items-center gap-1.5">
          <i data-lucide="dumbbell" class="w-3.5 h-3.5"></i>运动间歇训练
        </span>
        <span class="text-muted-foreground/60" aria-hidden="true">·</span>
        <span class="inline-flex items-center gap-1.5">
          <i data-lucide="brain" class="w-3.5 h-3.5"></i>专注番茄钟
        </span>
      </section>

      <!-- Ad slot -->
      <section class="adslot rounded-lg border border-dashed border-border bg-card/40 p-4 flex flex-col items-center gap-1 text-center" aria-label="广告位">
        <span class="text-muted-foreground text-[12px] tracking-[0.2em]">广告位 · Ad Slot</span>
        <span class="text-[11px] text-muted-foreground/70">可嵌入展示型广告获取收益</span>
      </section>

      <!-- Footer note -->
      <p class="text-center text-[11px] text-muted-foreground/60 pt-2">© 极简计时器 · 精密专注的垂直计时工具</p>

      <style class="critical-layout">
        /* Critical layout-safe static CSS for countdown shell geometry */
        html, body { overflow-x: hidden; }
        body { position: relative; min-height: 100vh; }

        .bg-texture {
          position: fixed;
          inset: 0;
          z-index: 0;
          pointer-events: none;
          background-color: var(--tm-background);
          background-image:
            linear-gradient(to right, rgba(56,242,198,0.025) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(56,242,198,0.025) 1px, transparent 1px),
            radial-gradient(circle at 50% 38%, rgba(56,242,198,0.08) 0%, rgba(56,242,198,0) 55%);
          background-size: 44px 44px, 44px 44px, 100% 100%;
          background-repeat: repeat, repeat, no-repeat;
        }

        .topbar { position: sticky; top: 0; z-index: 20; }

        .content-wrap, .topbar__inner { position: relative; z-index: 1; }

        .tabs {
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
          padding-bottom: 2px;
        }
        .tabs__indicator {
          position: absolute;
          bottom: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 96px;
          height: 2px;
          background: var(--tm-primary);
          border-radius: 2px;
          opacity: 0.9;
        }

        .display__digits {
          font-family: var(--tm-font-mono);
          font-size: clamp(56px, 13vw, 160px);
          line-height: 1;
          letter-spacing: -0.02em;
          text-shadow: 0 0 40px rgba(56,242,198,0.18);
          white-space: nowrap;
        }
        .display__ms {
          font-size: 0.45em;
          color: var(--tm-muted-foreground);
          margin-left: 0.05em;
        }

        .progress__track { margin-top: 2px; }
        .progress__ticks { pointer-events: none; }

        .presets-card { width: 100%; }
        .preset {
          min-width: 0;
          cursor: pointer;
          transition: background-color .15s ease, border-color .15s ease, color .15s ease;
        }
        /* hover：浅灰背景（非选中时） */
        .preset:not(.preset--active):hover { background-color: rgba(148, 163, 184, 0.10); }
        /* 选中态：主色背景高亮 + 边框 */
        .preset.preset--active {
          background-color: rgba(56, 242, 198, 0.14);
          border-color: var(--tm-primary, #38f2c6);
          box-shadow: inset 0 0 0 1px rgba(56, 242, 198, 0.30);
        }
        .preset.preset--active .font-mono { color: var(--tm-primary, #38f2c6); }
        .preset.preset--active span:not(.font-mono) { color: rgba(56, 242, 198, 0.85); }

        .controls .btn { min-width: 0; }

        @media (max-width: 380px) {
          .display__digits { font-size: clamp(48px, 14vw, 120px); }
          .btn--primary { padding-left: 1.5rem; padding-right: 1.5rem; }
        }
      </style>
    </main>
    <script src="../assets/app.js?v=15"></script>
    <script>lucide.createIcons();</script>
</body>
